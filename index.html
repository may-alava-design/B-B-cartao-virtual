function fmtPhone(p) { return p.replace(/(\d{2})(\d{2})(\d{5})(\d{4})/, '($1) $2 $3-$4'); }

function updateCard() {
  const idx = document.getElementById('person').value;
  if (idx === '') {
    document.getElementById('cardName').textContent = 'Selecione uma pessoa';
    document.getElementById('cardTitle').textContent = '—';
    document.getElementById('cardButtons').innerHTML = '';
    const btn = document.getElementById('downloadBtn');
    btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none'; btn.onclick = () => false;
    return;
  }
  const p = PEOPLE[parseInt(idx)];
  document.getElementById('cardName').textContent = p.name;
  document.getElementById('cardTitle').textContent = p.title;
  document.getElementById('cardButtons').innerHTML = buildButtons(p);
  const html = buildStandaloneHTML(p);
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const btn = document.getElementById('downloadBtn');
  btn.href = url;
  btn.download = `cartao-${p.name.split(' ')[0].toLowerCase()}-bb.html`;
  btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; btn.onclick = null;
}
</script>
